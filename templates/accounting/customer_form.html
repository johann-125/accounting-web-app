{% extends "base.html" %}
{% block title %}{{ action }} Customer{% endblock %}
{% block page_title %}{{ action }} Customer{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1><i class="bi bi-person-{% if action == 'Create' %}plus{% else %}pencil{% endif %}-fill me-2 text-primary"></i>{{ action }} Customer</h1>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="{{ url_for('main.dashboard') }}">Dashboard</a></li>
                <li class="breadcrumb-item"><a href="{{ url_for('accounting.customers') }}">Customers</a></li>
                <li class="breadcrumb-item active">{{ action }}</li>
            </ol>
        </nav>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card">
            <div class="card-header"><span><i class="bi bi-person-fill me-2"></i>Customer Information</span></div>
            <div class="card-body">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label">Full Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name"
                                   value="{{ customer.name if customer else form_data.get('name', '') }}"
                                   placeholder="e.g. John Smith" required>
                        </div>
                        <div class="col-md-6">
                            <label for="company" class="form-label">Company</label>
                            <input type="text" class="form-control" id="company" name="company"
                                   value="{{ customer.company or '' if customer else form_data.get('company', '') }}"
                                   placeholder="Company name">
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email"
                                   value="{{ customer.email or '' if customer else form_data.get('email', '') }}"
                                   placeholder="customer@example.com">
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="text" class="form-control" id="phone" name="phone"
                                   value="{{ customer.phone or '' if customer else form_data.get('phone', '') }}"
                                   placeholder="+1 (555) 000-0000">
                        </div>
                        <div class="col-12">
                            <label for="address" class="form-label">Address</label>
                            <textarea class="form-control" id="address" name="address" rows="2"
                                      placeholder="Street address, city, state, zip">{{ customer.address or '' if customer else form_data.get('address', '') }}</textarea>
                        </div>
                        <div class="col-12">
                            <label for="notes" class="form-label">Notes</label>
                            <textarea class="form-control" id="notes" name="notes" rows="2"
                                      placeholder="Internal notes about this customer">{{ customer.notes or '' if customer else form_data.get('notes', '') }}</textarea>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle me-1"></i> {{ action }} Customer
                        </button>
                        <a href="{{ url_for('accounting.customers') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle me-1"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
